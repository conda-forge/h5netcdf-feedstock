schema_version: 1

context:
  version: "1.8.2"

package:
  name: h5netcdf
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/h/h5netcdf/h5netcdf-${{ version }}.tar.gz
  sha256: 3c34102269d99f7631d6529ff7a3067f51677f23ebf14669da1dc795af1caac5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - setuptools-scm >=7.0
    - pip
  run:
    - python >=${{ python_min }}
    - h5py
    - packaging
    - numpy

tests:
  - python:
      imports:
        - h5netcdf
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: netCDF4 via h5py
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/h5netcdf/
  repository: https://github.com/h5netcdf/h5netcdf

extra:
  recipe-maintainers:
    - hmaarrfk
    - jhamman
    - ocefpaf
    - shoyer
    - kmuehlbauer
